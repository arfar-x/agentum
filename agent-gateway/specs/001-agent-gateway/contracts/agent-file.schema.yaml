# JSON-schema-like description of agent-gateway/config/agents/<id>.yaml
version: 1                       # required, must be 1
id: string                       # required
name: string                     # required
description: string
model: string                    # may use ${ENV}
model_parameters: {}             # free-form OpenAI parameters
allow_client_overrides: bool     # default true
locked_parameters: [string]
allow_model_override: bool       # default true
client_system: append|prepend|ignore
client_tools: all|none|[string]
instructions: string             # required
tools:
  - server: string               # key in mcp-servers.yaml
    include: [glob]
    approval: [glob]             # subset of include; gateway-run calls need approval
interaction: [ask_user]
preretrieval:
  kb: {enabled: bool, limit: int, types: [string], query_rewrite: bool}
handoffs:
  - {to: string, description: string}
activity: narrate|quiet
context_window: int             # optional; reported on /v1/models instead of the default
access:                          # optional; absent = every signed-in person may use the agent and its write tools
  groups: [string]               # use the agent if the caller has ANY listed group or ANY listed role
  roles: [string]                #   (neither given = everyone)
  write_groups: [string]         # use its approval-gated tools: same rule over these two lists
  write_roles: [string]          #   (neither given = anyone who may use the agent)
  # every present list: non-empty, unique, valid names (1-128 chars, no comma/control char);
  # unknown keys and an empty block are rejected. Groups and roles are assigned in the identity provider.
