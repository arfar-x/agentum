[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "Serves configured agents through an OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "fastmcp>=3.4,<4",
  "cryptography>=42",
  "psycopg[binary]>=3.2",
  "redis>=5",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.40"]

[project.scripts]
agent-gateway = "agent_gateway.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["services: needs Postgres and Redis (scripts/test-services.sh)"]
