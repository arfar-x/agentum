name: kb tests

on:
  pull_request:
    paths:
      - "kb/**"
      # Checked by kb/tests/test_deployment.py: the root files that include the
      # module and must not leak its variables.
      - "docker-compose.yml"
      - ".env.example"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/kb-tests.yml"
  push:
    branches: [main]
    paths:
      - "kb/**"
      # Checked by kb/tests/test_deployment.py: the root files that include the
      # module and must not leak its variables.
      - "docker-compose.yml"
      - ".env.example"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/kb-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same image as the kb-db service and kb/scripts/test.sh, so the
    # Postgres-backed tests run here too instead of being skipped.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15-trixie
        env:
          POSTGRES_PASSWORD: kbtest
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KB_TEST_DATABASE_URL: postgresql://postgres:kbtest@127.0.0.1:5432/kb_test

    defaults:
      run:
        working-directory: kb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kb/pyproject.toml

      # Every extra: the suite imports the adapters (psycopg, requests/yaml,
      # fastmcp), so collection fails without them.
      - run: pip install -e '.[dev,store,sources,mcp,admin]'

      - run: python -m pytest

      # The script that creates kb/.env and carries an older deployment's
      # values across. Needs no services.
      - run: bash kb/scripts/prepare.test.sh
        working-directory: .

  # The compose file still parses with every optional profile on. `docker
  # compose config` needs no daemon, and catches a variable renamed in one
  # place and not the other before `make up` does.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          { cat .env.example; bash scripts/generate-secrets.sh | grep -E '^[A-Z_]+='; echo RAG_EMBEDDINGS_MODEL=dummy; } > .env
          bash kb/scripts/prepare.sh --admin
          docker compose --profile admin --profile webhook config -q

  # The admin console's web app (kb/frontend): types, unit tests, and a
  # production build -- the same `npm run build` the image runs, so a build that
  # would fail `docker compose build` fails here first.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kb/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kb/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
