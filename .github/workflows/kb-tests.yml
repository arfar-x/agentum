name: kb tests

on:
  pull_request:
    paths:
      - "kb/**"
      - "docs/spec/knowledge-base.md"
      - ".github/workflows/kb-tests.yml"
  push:
    branches: [main]
    paths:
      - "kb/**"
      - "docs/spec/knowledge-base.md"
      - ".github/workflows/kb-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same image as the kb-db service and scripts/kb-test.sh, so the
    # Postgres-backed tests run here too instead of being skipped.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15-trixie
        env:
          POSTGRES_PASSWORD: kbtest
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KB_TEST_DATABASE_URL: postgresql://postgres:kbtest@127.0.0.1:5432/kb_test

    defaults:
      run:
        working-directory: kb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kb/pyproject.toml

      # Every extra: the suite imports the adapters (psycopg, requests/yaml,
      # fastmcp), so collection fails without them.
      - run: pip install -e '.[dev,store,sources,mcp]'

      - run: python -m pytest
