  name: Prepare for Dev
  description: 'Takes a request to an approved product spec and developer-ready Jira work: drafts the spec, saves it to Confluence as a draft, clarifies it with you, checks readiness, gets your approval, then publishes it and creates the tickets.'
  category: general
