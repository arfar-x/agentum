agent:
  id: agent_0v1CG8XL1JEAH0xScSp5y
  name: Product Assistant
  description: The product team's front door — routes to Plan, Doc Gen, Prepare for Dev, Engineering Review, Tasks, or Docs depending on the request, and answers quick Jira/Confluence lookups directly without spinning up a specialist.
  category: general
  provider: OpenAI Compatible
