# agentflow -- LibreChat + agent-skills MCP + an OpenAI-compatible LLM (vLLM)
#
# Every service is a pinned image; every config a mounted file; every byte of
# durable state a named volume (see docs/OPERATIONS.md). Nothing is baked
# into an image build, so this maps 1:1 onto Deployments/PVCs later.
#
# mcp-agent-skills deliberately has no published port and is on the backend
# network only -- fastmcp's HTTP transport has no authentication of any
# kind. Reachability from `api` over the internal network is the only access
# control it has; do not add a `ports:` entry to it.

# Modules own their services, volumes and variables. Each is included with the
# ONE env file it interpolates from -- never this stack's .env -- so a module's
# variables are not visible to the rest, and the rest's are not visible to it.
# They join the shared networks declared below. A module's env file must exist
# before any `docker compose` command runs: `make up` creates it (see
# kb/scripts/prepare.sh).
include:
  - path: kb/compose.yaml
    env_file: kb/.env
  # No env_file here: the bot's service reads its own file, and nothing in it is interpolated.
  - path: integrations/telegram-bot/compose.yaml

networks:
  frontend:
  backend:
  # crw's own network, and the only one it is on. crw fetches whatever URLs
  # search results contain -- addresses chosen by the internet, not by us --
  # so it must not share a network with anything that trusts its callers by
  # reachability, which is every service on `backend` (mongodb, the MCP
  # servers, kb-webhook, ...). A link to http://mongodb:27017 in a search
  # result must resolve to nothing. `api` joins this network to call crw; a
  # container on two networks doesn't route between them, so that gives api
  # crw, never crw backend.
  scraper:
  # mcp-agent-skills' own network. It trusts per-request headers (Jira and
  # Confluence credentials, and which user's upload folder a request may
  # read) because only `api` can reach it -- so nothing else may share a
  # network with it. On `backend` any of a dozen containers (searxng, rag_api,
  # ...) could send those headers and read any user's uploads.
  agent-tools:
  # The agent gateway's own networks (profile `gateway`). It is the one service besides `api`
  # that external clients reach, so it must not share a network with anything that trusts its
  # callers by reachability: it never joins `backend`. Its tool server and its stores each sit
  # on a network only it joins, and mcp-kb is reachable to it through gateway-kb alone.
  gateway-tools:
  gateway-kb:
  gateway-data:
  # The one link between LibreChat and the gateway: only `api` and `agent-gateway` join it, so the
  # gateway is reachable from `api` as a chat connection without ever sharing `backend`.
  gateway-api:
  # The one link between the Telegram bot and the gateway: only `telegram-bot-gateway` and
  # `agent-gateway` join it. The bot reaches its own database over gateway-data and never joins
  # `backend`.
  telegram-gateway:

volumes:
  mongodb_data:
  pgvector_data:
  meili_data:
  librechat_uploads:
  librechat_images:
  librechat_logs:
  gateway_db_data:

services:
  api:
    # registry.librechat.ai is the registry upstream's own compose files pull
    # from since v0.8.8 (the project moved to the LibreChat-AI org). The old
    # ghcr.io/danny-avila mirror stops at v0.8.7 -- don't point back at it.
    image: registry.librechat.ai/librechat-ai/librechat:${LIBRECHAT_IMAGE_TAG:?set LIBRECHAT_IMAGE_TAG in .env}
    restart: unless-stopped
    ports:
      # Bound to all interfaces (0.0.0.0) so clients on the LAN can reach the
      # UI directly. The repo's upstream default is 127.0.0.1-only -- if this
      # box ever gets a public interface, or you want TLS, re-bind to
      # 127.0.0.1 and put a reverse proxy in front instead.
      - "${PORT:-3080}:${PORT:-3080}"
    # Pin the model host (VLLM_BASE_URL's host) to a fixed IP for container
    # DNS, for the services that call the model. Defaults are harmless
    # placeholders -- set MODEL_HOSTNAME / MODEL_HOST_IP in .env to pin a real
    # host (needed when it doesn't resolve from this box the way you want).
    extra_hosts:
      - "${MODEL_HOSTNAME:-your-model-host}:${MODEL_HOST_IP:-192.0.2.1}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rag_api:
        condition: service_started
      mcp-agent-skills:
        condition: service_healthy
      crw:
        condition: service_started
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      MEILI_HOST: http://meilisearch:7700
      RAG_API_URL: http://rag_api:8000
      # Shared generation store: a scheduled run of an agent that can pause
      # (ask_user_question, or a tool on toolApproval's `ask` list) is
      # refused without it. LibreChat only builds its Redis client when
      # USE_REDIS is on, so streams can't be had without it; that also moves
      # its caches into Redis, which are all rebuildable.
      USE_REDIS: "true"
      REDIS_URI: redis://redis:6379
      USE_REDIS_STREAMS: ${USE_REDIS_STREAMS:-true}
      ADMIN_PANEL_URL: http://localhost:${ADMIN_PANEL_PORT:-3000}
      # The image runs node with NODE_ENV=production, so LibreChat marks the
      # httpOnly `refreshToken` cookie `Secure` (see shouldUseSecureCookie in
      # packages/api) -- and browsers DROP Secure cookies set over plain
      # HTTP. With no refresh cookie the UI can only renew its 15-minute
      # access token until it can't, at which point it redirects to /login:
      # users were force-logged-out ~15 min after every sign-in. This stack
      # is HTTP on the LAN (no TLS in front), so the cookie must not be
      # Secure -- same setting admin-panel already uses. Read from .env, and
      # false when it isn't there, so an older .env is still correct. If a TLS
      # reverse proxy is ever put in front, set it to true in .env.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      # Generated (gitignored) from config/librechat.yaml.example by
      # scripts/render-librechat-config.sh -- `make up` runs this before
      # every `docker compose up`, so it always exists by the time this
      # mount is needed. See AGENTS.md "Configuration is generated".
      - type: bind
        source: ./config/librechat.yaml
        target: /app/librechat.yaml
        read_only: true
      - librechat_uploads:/app/uploads
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
    networks: [frontend, backend, scraper, agent-tools, gateway-api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      # The LibreChat image ships wget, not curl -- confirmed by exec'ing in
      # and checking, after curl-based healthchecks failed with
      # "executable file not found in $PATH".
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${PORT:-3080}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  # Standalone management UI (users, groups, roles, config overrides) --
  # github.com/ClickHouse/librechat-admin-panel, LibreChat's own bundled
  # service. Admin access is checked by `api` itself (role: 'ADMIN' in
  # Mongo, or the access:admin grant), so this container can't grant
  # itself anything -- see docs/CONFIGURATION.md.
  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    restart: unless-stopped
    ports:
      # Bound to all interfaces (0.0.0.0) so the panel is reachable over the
      # network, not just from this box -- same shape as `api` above.
      - "0.0.0.0:${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3000"
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:?set ADMIN_PANEL_SESSION_SECRET in .env}
      API_SERVER_URL: http://api:${PORT:-3080}
      VITE_API_BASE_URL: http://localhost:${PORT:-3080}
      SESSION_COOKIE_SECURE: "false"
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 512m

  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Read by mongo-init/init-librechat-user.sh, not by mongod itself --
      # the official mongo image runs every /docker-entrypoint-initdb.d/
      # script with the container's own env available, exactly once, only
      # when mongodb_data is empty.
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init/init-librechat-user.sh:/docker-entrypoint-initdb.d/init-librechat-user.sh:ro
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 1g

  # In-flight generation state and caches for LibreChat (USE_REDIS /
  # USE_REDIS_STREAMS). No auth and no published port: reachable only from
  # `api` on `backend`, like mongodb. Nothing here is worth keeping across a
  # restart (a lost job just fails that run, a lost cache is rebuilt), so no
  # volume and no persistence -- and nothing to back up.
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 1g

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:${RAG_API_IMAGE_TAG:?set RAG_API_IMAGE_TAG in .env}
    restart: unless-stopped
    # Same model-host pin as `api` -- rag_api also calls VLLM_BASE_URL (for
    # embeddings). See the api.extra_hosts comment above.
    extra_hosts:
      - "${MODEL_HOSTNAME:-your-model-host}:${MODEL_HOST_IP:-192.0.2.1}"
    depends_on:
      vectordb:
        condition: service_healthy
    environment:
      DB_HOST: vectordb
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_OPENAI_BASEURL: ${VLLM_BASE_URL}
      RAG_OPENAI_API_KEY: ${VLLM_API_KEY}
      EMBEDDINGS_PROVIDER: ${RAG_EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${RAG_EMBEDDINGS_MODEL:?set RAG_EMBEDDINGS_MODEL in .env}
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 1g

  mcp-agent-skills:
    build:
      context: ./agent-skills
      dockerfile: mcp-server/Dockerfile
      args:
        TOOLSETS: ${MCP_TOOLSETS:-jira}
    restart: unless-stopped
    # Deliberately no `env_file: .env`: that file holds the whole stack's
    # secrets, and every user credential this service needs arrives per
    # request in headers. It gets only the settings below.
    environment:
      JIRA_AUTO_CONFIRM_WRITES: ${JIRA_AUTO_CONFIRM_WRITES:-false}
      JIRA_DEPLOYMENT_TYPE: ${JIRA_DEPLOYMENT_TYPE:-}
      CONFLUENCE_AUTO_CONFIRM_WRITES: ${CONFLUENCE_AUTO_CONFIRM_WRITES:-false}
      CONFLUENCE_DEPLOYMENT_TYPE: ${CONFLUENCE_DEPLOYMENT_TYPE:-}
      GITLAB_AUTO_CONFIRM_WRITES: ${GITLAB_AUTO_CONFIRM_WRITES:-false}
      # Files users upload in chat, attachable to Jira/Confluence. LibreChat
      # keeps one folder per user in this volume, mounted read-only below;
      # per-user mode limits each request to the folder of the user named
      # in its X-Agent-Skills-User header (config/librechat.yaml.example),
      # and agent-skills refuses anything outside it, hidden, or
      # secret-looking.
      AGENT_SKILLS_ATTACHMENT_DIR: /attachments
      MCP_ATTACHMENT_DIR_PER_USER: "1"
      # Honors X-Agent-Skills-Env-<VAR> per-request headers (e.g. a
      # different Jira credential per LibreChat user) instead of only this
      # server process's own env. Safe to enable *here* specifically
      # because this service has no published port and no Keycloak
      # provider configured -- `api` on the backend network is the only
      # caller that can reach it at all, which is the network-isolation
      # exception server.py's own startup warning calls out. See
      # agent-skills/AUTHENTICATION.md, Part 3.
      MCP_TRUST_REQUEST_CREDENTIALS: "1"
      # A per-user field LibreChat can't leave empty is entered as `-`; this
      # makes such a header mean "not set" for that call rather than a
      # literal value (agent-skills >= v0.17.1). The comment above
      # config/librechat.yaml.example's agent-skills headers explains why.
      MCP_UNSET_HEADER_VALUE: "-"
    volumes:
      - librechat_uploads:/attachments:ro
    networks: [agent-tools]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8321), timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  # Page scraper for LibreChat's web search: SearXNG finds the links, crw
  # fetches the pages and returns them as markdown. LibreChat talks to it as
  # a self-hosted Firecrawl (webSearch.scraperProvider: firecrawl) -- crw
  # implements Firecrawl's /v1 and /v2 scrape API. No published port, and
  # NOT on `backend`: only on `scraper`, which only `api` joins (see the
  # networks comment at the top). It has no auth of its own (no [auth]
  # api_keys configured), which is why it must never get a `ports:` entry --
  # and it fetches attacker-chosen URLs, which is why it must never join
  # `backend`. CRW_RENDERER__MODE=none: plain HTTP plus crw's built-in
  # browser-impersonation fallback, no headless-browser sidecar -- see
  # docs/CONFIGURATION.md "Web search" for adding LightPanda when JS-only
  # pages come back empty. The image ships no curl/wget, so there is no
  # healthcheck; it serves GET /health on port 3000.
  crw:
    image: ghcr.io/fastcrw/crw:0.37.2
    restart: unless-stopped
    environment:
      CRW_RENDERER__MODE: none
    networks: [scraper]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m

  # ---- agent gateway (profile `gateway`; `make gateway-up`) -----------------------------------
  # Serves the agents through an OpenAI-compatible API to clients outside LibreChat. See
  # agent-gateway/README.md. It publishes one port, authenticates every request with a key it
  # issued, and reaches only its own database, its own Redis, the catalog (read-only) and its
  # own tool server.
  agent-gateway:
    profiles: [gateway]
    build:
      context: ./agent-gateway
    restart: unless-stopped
    depends_on:
      gateway-db:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      mcp-agent-skills-gateway:
        condition: service_healthy
    # Identity (OIDC_*, DIRECTORY_*, PORTAL_*, KB_TRUST_SECRET, GATEWAY_ISSUE_KEYS) is read from
    # .env.agent-gateway; see docs/KEYCLOAK.md. The gateway reaches the identity provider by its
    # public URL over the default bridge; it never needs `backend` for that.
    env_file:
      - path: .env.agent-gateway
        required: false
    environment:
      UPSTREAM_BASE_URL: ${VLLM_BASE_URL:?set VLLM_BASE_URL in .env}
      UPSTREAM_API_KEY: ${VLLM_API_KEY:-}
      DEFAULT_MODEL: ${VLLM_DEFAULT_MODEL:?set VLLM_DEFAULT_MODEL in .env}
      # Reported on /v1/models so clients can size their own budgets.
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-262144}
      REDIS_URL: redis://gateway-redis:6379/0
      GATEWAY_PORT: "8080"
    ports:
      # Bind address + port both come from .env (GATEWAY_BIND_ADDR / GATEWAY_PUBLISHED_PORT).
      # Loopback by default so it is not reachable from the network; put a reverse proxy /
      # TLS terminator in front if clients on other machines need it.
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:${GATEWAY_PUBLISHED_PORT:-8090}:8080"
    volumes:
      - ./agent-gateway/config:/etc/agent-gateway:ro
    networks: [gateway-tools, gateway-kb, gateway-data, gateway-api, telegram-gateway]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 512m

  # The gateway's tool server: the same agent-skills image as mcp-agent-skills, on a network only
  # the gateway joins. It has no upload volume and is never told which user is calling, so
  # attachments are off here -- files go through the tools' content arguments instead.
  mcp-agent-skills-gateway:
    profiles: [gateway]
    build:
      context: ./agent-skills
      dockerfile: mcp-server/Dockerfile
      args:
        TOOLSETS: ${MCP_TOOLSETS:-jira}
    restart: unless-stopped
    environment:
      JIRA_AUTO_CONFIRM_WRITES: ${JIRA_AUTO_CONFIRM_WRITES:-false}
      JIRA_DEPLOYMENT_TYPE: ${JIRA_DEPLOYMENT_TYPE:-}
      CONFLUENCE_AUTO_CONFIRM_WRITES: ${CONFLUENCE_AUTO_CONFIRM_WRITES:-false}
      CONFLUENCE_DEPLOYMENT_TYPE: ${CONFLUENCE_DEPLOYMENT_TYPE:-}
      GITLAB_AUTO_CONFIRM_WRITES: ${GITLAB_AUTO_CONFIRM_WRITES:-false}
      # Trusting per-request credential headers is safe here for the same reason as on
      # mcp-agent-skills: no published port, and only agent-gateway shares its network.
      MCP_TRUST_REQUEST_CREDENTIALS: "1"
      MCP_UNSET_HEADER_VALUE: "-"
    networks: [gateway-tools]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8321), timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  gateway-db:
    profiles: [gateway]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env.agent-gateway
        required: false
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
    volumes:
      - gateway_db_data:/var/lib/postgresql/data
    networks: [gateway-data]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  gateway-redis:
    profiles: [gateway]
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gateway-data]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
