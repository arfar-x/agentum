[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-gateway"
version = "0.1.0"
description = "A Telegram client for any OpenAI-compatible Chat Completions endpoint"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
serve = [
  "python-telegram-bot>=22",
  "httpx>=0.27",
  "cryptography>=42",
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
telegram-bot-gateway = "telegram_bot_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["services: needs Postgres (scripts/test-services.sh)"]
